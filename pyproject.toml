[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marsad"
version = "1.4.0"
description = "Position-trust layer for autonomous systems: GNSS jamming/spoofing detection, track integrity scoring, fallback navigation advice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Huda Mueen" }]
keywords = ["gnss", "spoofing", "jamming", "resilient-pnt", "px4", "mavlink", "uav", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []   # core engine is standard-library only (onboard portability)

[project.optional-dependencies]
sim = ["numpy>=1.26"]
adapters = ["pyulog>=1.0", "pymavlink>=2.4"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
mcp = ["mcp>=1.2"]
dev = ["ruff>=0.6", "build", "pytest>=8", "numpy>=1.26", "pyulog>=1.0", "pymavlink>=2.4", "fastapi>=0.110", "httpx>=0.27", "mcp>=1.2", "uvicorn>=0.27"]

[project.urls]
Homepage = "https://github.com/hudasol/marsad"
Issues = "https://github.com/hudasol/marsad/issues"
Changelog = "https://github.com/hudasol/marsad/blob/main/CHANGELOG.md"

[project.scripts]
marsad = "marsad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marsad = ["dashboard/*", "dashboard/vendor/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E741",   # ambiguous names such as l: used for lon/lat style locals in the geometry code
    "B905",   # zip without strict: lengths are equal by construction in the numeric code
]

[tool.ruff.lint.per-file-ignores]
"src/marsad/api/texts.py" = ["E501"]     # operator facing prose
"src/marsad/bench/report.py" = ["E501"]  # markdown table rows
"scripts/*" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["marsad"]
